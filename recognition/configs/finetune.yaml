# Fine-tune the pretrained TrOCR-small on real handwriting.
#   python scripts/run_finetune.py --config configs/finetune.yaml
#   python scripts/run_finetune.py --resume

model:
  pretrained: outputs/trocr_small_bi_pretrain_stage2/best
  tokenizer: assets/tokenizer_bi
  max_target_len: 128

data:
  cyrillic_root: data/cyrillic
  batch_size: 64
  num_workers: 8
  en_ratio: 0.2              # share of English per batch (null -> natural proportion ~8%)
  iam:
    enabled: true
    hf_id: Teklia/IAM-line
    cache_dir: data/iam
    image_key: image
    text_key: text
    train_split: train
    test_split: test

trainer:
  num_epochs: 20
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  amp_dtype: bf16
  grad_clip: 1.0
  num_beams: 4
  log_every: 50
  select_metric: nes_char    # best model = max harmonic mean of this metric over ru/en
  output_dir: outputs/trocr_small_bi_finetune_updated

device: cuda
