# Pretrain bilingual (EN+RU) TrOCR-small on synthetic lines.
#   python scripts/run_pretrain.py --config configs/pretrain_small.yaml
#   python scripts/run_pretrain.py --resume

model:
  pretrained: microsoft/trocr-small-handwritten
  tokenizer: assets/tokenizer_bi    # English + RU tokens (scripts/train_tokenizer.py); if missing -> english only
  max_target_len: 128

data:
  ru_text_dirs: ['/mnt/DATA2/varlamova/HTR/trocr/data/texts/school', '/mnt/DATA2/varlamova/HTR/trocr/data/texts/general']
  en_text_dirs: ['/mnt/DATA2/varlamova/HTR/trocr/data/texts/english']
  ru_text_weights: [0.7, 0.3]        # вес каждой ru-папки (длина == ru_text_dirs); [] = по числу файлов
  en_text_weights: []
  ru_font_dirs: ['/mnt/DATA2/dorin/handwriting-recognition/recognition/assets/fonts_ru']
  en_font_dirs: ['/mnt/DATA2/dorin/handwriting-recognition/recognition/assets/fonts_en']
  p_ru: 0.7                  # share of Russian lines (rest English)
  batch_size: 128
  num_workers: 8
  val_samples: 500           # fixed synthetic val (mix EN+RU); replace with real lines later
  len_chars: [8, 100]
  p_hyphenate: 0.15

synth:
  warmup_steps: 8000         # curriculum ramp (difficulty 0 -> 1)
  seed: 42

trainer:
  max_steps: 100000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 2000         # LR warmup
  freeze_encoder_steps: 2000 # phase 1: warm up the new RU token embeddings/head
  amp_dtype: bf16            # bf16 | fp16 | fp32
  grad_clip: 1.0
  num_beams: 1
  log_every: 50
  eval_every: 2000
  output_dir: 'outputs/trocr_small_bi_pretrain'

device: cuda