data:
  # ai-forever School Notebooks: photos of notebooks, many of them spreads, every page outlined
  # (COCO category `paper`). A HuggingFace dataset id (read from the local cache) or a folder.
  notebooks: [ai-forever/school_notebooks_RU, ai-forever/school_notebooks_EN]
  # folders of single-page scans that fill the frame (exam sheets); [] = notebooks only
  scans: []
  scan_share: 0.3                        # part of the training samples made from scans
  p_spread: 0.35                         # a scan sample is two sheets side by side
  p_full: 0.4                            # a single sheet fills the whole frame, no table around
  image_size: 512                        # model input, the photo is letterboxed into it
  stride: 4                              # maps are image_size / stride
  shrink: 0.12                           # the core of a page lies deeper than shrink * sqrt(page area) from its outline

aug:
  p_geometry: 0.85                       # otherwise the photo is framed exactly as at inference
  rotate: 15                             # degrees
  p_rot90: 0.15                          # plus a quarter turn: the orientation step can be wrong
  zoom: [0.6, 1.3]                       # < 1 the photo gets smaller in the frame, > 1 it is cropped
  shift: 0.08                            # fraction of the photo side
  perspective: 0.04                      # each frame corner moves by up to this fraction of the side
  brightness: 0.3
  contrast: 0.3
  saturation: 0.3
  p_blur: 0.2
  p_jpeg: 0.3

train:
  epochs: 60
  batch_size: 16
  lr: 5.0e-4
  warmup_frac: 0.03
  min_lr_frac: 0.01
  num_workers: 8
  device: cuda
  resume: true                           # continue from last.pt if present

model:
  width: 64                              # channels of the decoder
  pretrained: true                       # ImageNet weights for the encoder

out_dir: outputs                         # relative to this config
